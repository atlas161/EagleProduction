<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO : ces valeurs sont remplacées page par page au build (build.js, depuis lib/pages.mjs) et côté client (hooks/useSeo.ts) -->
    <title>EAGLE PRODUCTION | Drone Angoulême, Vidéo & Photo | + Eagle Digital (Site Web, SEO)</title>
    <meta name="description" content="Eagle Production : télépilote drone certifié DGAC à Angoulême (Charente). Inspection de toiture, suivi de chantier BTP, photo/vidéo immobilier, Reels & Shorts, sport et événementiel. Eagle Digital : site web, SEO local et maintenance." />
    <meta name="geo.region" content="FR-16" />
    <meta name="geo.placename" content="Angoulême" />
    <meta name="geo.position" content="45.6484;0.1562" />
    <meta name="ICBM" content="45.6484, 0.1562" />
    <meta name="author" content="Eagle Production" />
    <meta name="robots" content="index, follow" />

    <!-- Favicon PNG/ICO uniquement : favicon.svg pèse 530 Ko (PNG encodés en base64), trop lourd pour une icône -->
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#111111" />
    <meta name="color-scheme" content="dark" />

    <!-- OPEN GRAPH / FACEBOOK / LINKEDIN -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.eagle-prod.com/" />
    <meta property="og:title" content="EAGLE PRODUCTION | Drone Angoulême, Vidéo & Photo | + Eagle Digital (Site Web, SEO)" />
    <meta property="og:description" content="Eagle Production : télépilote drone certifié DGAC à Angoulême (Charente). Inspection de toiture, suivi de chantier BTP, photo/vidéo immobilier, Reels & Shorts, sport et événementiel. Eagle Digital : site web, SEO local et maintenance." />
    <meta property="og:image" content="https://www.eagle-prod.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Paul Bardin, télépilote de drone à Angoulême, fondateur d'Eagle Production" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Eagle Production" />

    <!-- TWITTER -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.eagle-prod.com/" />
    <meta name="twitter:title" content="EAGLE PRODUCTION | Drone Angoulême, Vidéo & Photo | + Eagle Digital (Site Web, SEO)" />
    <meta name="twitter:description" content="Eagle Production : télépilote drone certifié DGAC à Angoulême (Charente). Inspection de toiture, suivi de chantier BTP, photo/vidéo immobilier, Reels & Shorts, sport et événementiel. Eagle Digital : site web, SEO local et maintenance." />
    <meta name="twitter:image" content="https://www.eagle-prod.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="Paul Bardin, télépilote de drone à Angoulême, fondateur d'Eagle Production" />

    <!-- STRUCTURED DATA (JSON-LD) : injecté par SEOSchema.tsx (accueil) et par chaque page -->

    <link rel="canonical" href="https://www.eagle-prod.com/" />
    <link rel="alternate" hreflang="fr" href="https://www.eagle-prod.com/" />
    <link rel="alternate" hreflang="x-default" href="https://www.eagle-prod.com/" />

    <!-- Vimeo (vidéo d'accueil) : connexion anticipée. La police Inter est auto-hébergée (@fontsource-variable/inter). -->
    <link rel="preconnect" href="https://player.vimeo.com" crossorigin />
    <link rel="dns-prefetch" href="https://i.vimeocdn.com" />
  </head>
  <body class="bg-background text-textPrimary antialiased selection:bg-accent selection:text-background">
    <!-- Formulaire caché pour Netlify Forms (détection au build) -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
