# Configuration Netlify - Eagle Production

[build]
  command = "npm run build"
  publish = "dist"
  timeout = "600s"

[build.environment]
  # Vite 6, react-router 7 et @vitejs/plugin-react 5 exigent Node 20+
  NODE_VERSION = "22"

# ─── Headers ──────────────────────────────────────────────────────────────────
# Ordre : du plus général au plus spécifique (les règles suivantes complètent/remplacent les précédentes).

[[headers]]
  for = "/*"
  [headers.values]
    # Sécurité
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    # HTML (et fichiers non hashés) : toujours revalidés (304 si inchangé) → un déploiement est visible immédiatement
    Cache-Control = "public, max-age=0, must-revalidate"

    # SEO
    X-Robots-Tag = "index, follow"

# Page légale : exclue de l'index Google (ne pas la bloquer dans robots.txt, sinon le noindex ne serait pas lu)
[[headers]]
  for = "/mentions-legales.html"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

# Médias référencés par URL (images du blog gérées par Pages CMS, logos) : noms non hashés → cache court
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Données de la carte (GeoJSON des départements)
[[headers]]
  for = "/*.geojson"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Assets Vite : noms hashés → cache d'un an, immuable (en dernier pour l'emporter sur les règles ci-dessus)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── Redirections ─────────────────────────────────────────────────────────────

# non-www vers www (cohérent avec le canonical https://www.eagle-prod.com)
[[redirects]]
  from = "https://eagle-prod.com/*"
  to = "https://www.eagle-prod.com/:splat"
  status = 301
  force = true

# HTTP vers HTTPS www
[[redirects]]
  from = "http://eagle-prod.com/*"
  to = "https://www.eagle-prod.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.eagle-prod.com/*"
  to = "https://www.eagle-prod.com/:splat"
  status = 301
  force = true

# Pas de fallback SPA « /* → /index.html » : toutes les routes sont pré-rendues par build.js
# (dist/<route>/index.html). Toute autre URL reçoit dist/404.html avec un vrai statut 404
# (l'appli y affiche la page « introuvable »), au lieu d'un faux 200 indexable.
